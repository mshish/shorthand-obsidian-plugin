# Runs the maintainer verification gate from AGENTS.md on a clean checkout: install,
# typecheck, build, test. Everything here is offline apart from the dependency install —
# no vault, no Obsidian, no Shorthand binary, and no API credentials.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Both runtimes are required: the toolchain and lockfile are npm's, while the test
      # script is `bun test`.
      - name: Use Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # `npm ci`, not `npm install`: it fails when package-lock.json names a different
      # shorthand-core commit than package.json's tag, which is the disagreement a bump
      # can leave behind.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Build before test, and never reorder these. main.js is gitignored, so a clean
      # checkout has no bundle at all, and test/plugin-bundle.test.ts throws rather than
      # building one itself — building there could deliver mid-edit code into a live vault.
      # Tests first would therefore fail on a missing bundle, not on the code under test.
      - name: Build bundle
        run: npm run build

      - name: Unit tests
        run: npm test
